worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 25M;

    # Jalan sebagai non-root, jadi semua temp path diarahkan ke /tmp
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Platform (Render / Cloud Run) terminasi HTTPS di depan.
    # Teruskan ke PHP sebagai HTTPS supaya URL Laravel/Inertia/Ziggy benar
    # tanpa perlu ubah bootstrap/app.php.
    map $http_x_forwarded_proto $app_https {
        default off;
        https   on;
    }

    server {
        # __PORT__ diganti oleh start.sh dari env PORT
        listen __PORT__;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Hanya index.php yang boleh dieksekusi
        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTPS $app_https;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}