[www]
; Penting: tanpa ini php-fpm menghapus env var (APP_KEY, DB_*, dll) dari platform
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Hemat RAM (512 MB)
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

request_terminate_timeout = 300